[package]
name = "crystal-battle"
version = "0.1.0"
edition = "2024"
description = "Pokémon Crystal's battle engine as a library: hand-written Rust that reproduces the original exactly."

[features]
# The trained battle AI (`ai::Agent`) and its trainer. No extra dependencies:
# the network is plain Rust.
ai = []
# Pokémon Crystal Legacy's game data (`GameData::crystal_legacy`).
crystal-legacy = []

[dependencies]
serde = { version = "1", features = ["derive"] }


[[example]]
name = "ai_train"
required-features = ["ai"]

[[example]]
name = "ai_eval"
required-features = ["ai"]

[[example]]
name = "ai_export"
required-features = ["ai"]

[[test]]
name = "crystal_legacy"
required-features = ["crystal-legacy"]

[[test]]
name = "legacy_rules"
required-features = ["crystal-legacy"]
