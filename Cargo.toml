[workspace]
members = [".", "crates/crystal-battle"]

# The harness: the transpiled original on an emulated Game Boy, the CLI, the
# recorder and the `gui` window — the reference the library in
# `crates/crystal-battle` is verified against.
[package]
name = "crystal-battle-harness"
version = "0.1.0"
edition = "2024"

[features]
# Off by default: a plain build is a lean headless binary with no glium/winit
# compiled in. Enable the interactive window + renderer with `--features gui`.
gui = ["dep:glium", "dep:winit"]
# The trained battle AI (`crystal_battle::ai`) and the CLI's `--vs-ai`.
ai = ["crystal-battle/ai"]

[dependencies]
crystal-battle = { path = "crates/crystal-battle" }
glium = { version = "0.36", optional = true }
winit = { version = "0.30", optional = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

